; PlatformIO Project Configuration File
;
; WS2812 180-LED strip driven by GPIO6 of an AirM2M Core ESP32-C3.
; The board runs a SoftAP captive portal and listens to the LD2402
; presence broadcaster on ESP-NOW channel 6.

[env:airm2m_core_esp32c3]
platform = espressif32@6.12.0
board = airm2m_core_esp32c3
framework = arduino

board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

lib_deps =
	fastled/FastLED@~3.7.8

; works around a Windows linker response-file encoding issue, see the script
extra_scripts = post:scripts/ascii_link_paths.py

build_flags =
	-DCORE_DEBUG_LEVEL=1
	; FLASH_LOCK + RMT asserts on ESP32-C3 (xSemaphoreTake while flash lock
	; suspends the scheduler). Prefer a short LED pause around NVS writes instead.
	-DFASTLED_ESP32_FLASH_LOCK=0
	-DFASTLED_RMT_MAX_CHANNELS=1
